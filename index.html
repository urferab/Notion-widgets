<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciclo 2026-2</title>
<style>
  /* ============================================================
     CONFIGURACIÓN DEL CICLO
     Para reutilizar este widget en otro ciclo, edita solo el
     bloque "CONFIG" dentro del <script> al final del archivo:
       - CYCLE_START_YEAR / MONTH / DAY
       - TOTAL_WEEKS
       - CYCLE_LABEL
     ============================================================ */

  :root {
    color-scheme: light dark;

    /* --- Tema claro (por defecto) --- */
    /* Fondo: verde pistacho translúcido (deja ver el fondo de Notion) */
    --card-bg: rgba(140, 195, 105, 0.20);
    --card-border: rgba(60, 85, 50, 0.16);
    --text: #202619;
    --muted: #5c6653;
    --track: rgba(32, 38, 25, 0.14);
    /* Acentos: tono sobrio (oliva-carbón) que contrasta con el pistacho, sin sumar otro verde */
    --accent: #565f49;
    --accent-strong: #333a2b;
    --shadow: 0 1px 2px rgba(20, 30, 22, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* Mismo verde pistacho, más translúcido para no empastar sobre fondo oscuro */
      --card-bg: rgba(140, 195, 105, 0.12);
      --card-border: rgba(200, 220, 185, 0.16);
      --text: #eef1e7;
      --muted: #b4bfa9;
      --track: rgba(238, 241, 231, 0.14);
      /* Acentos: crema/hueso sobrio, contrasta contra el pistacho oscurecido */
      --accent: #cfd6bd;
      --accent-strong: #eef1e2;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 200px;
    min-height: 90px;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    height: 100%;
    max-width: 480px;
    box-sizing: border-box;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    border-radius: clamp(10px, 3vw, 18px);
    padding: clamp(10px, 4vw, 22px) clamp(14px, 5vw, 26px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(2px, 1.2vw, 6px);
    overflow: hidden;
  }

  .cycle-label {
    font-size: clamp(0.62rem, 2.4vw, 0.78rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .week-number {
    font-size: clamp(1.3rem, 8vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .week-number.state-message {
    font-size: clamp(1rem, 5.5vw, 1.5rem);
  }

  .date-range {
    font-size: clamp(0.72rem, 2.8vw, 0.92rem);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vw, 12px);
    margin-top: clamp(4px, 1.5vw, 10px);
  }

  .progress-track {
    flex: 1 1 auto;
    height: clamp(5px, 1.6vw, 8px);
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
    min-width: 0;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    transition: width 0.5s ease;
  }

  .progress-pct {
    flex: 0 0 auto;
    font-size: clamp(0.7rem, 2.6vw, 0.88rem);
    font-weight: 600;
    color: var(--accent-strong);
    min-width: 2.4em;
    text-align: right;
  }

  /* Bloques muy estrechos: apila la etiqueta de porcentaje debajo de la barra */
  @container (max-width: 220px) {
    .progress-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

  <div class="card" role="status" aria-live="polite">
    <div class="cycle-label" id="cycleLabel">CICLO</div>
    <div class="week-number" id="weekNumber">—</div>
    <div class="date-range" id="dateRange">Cargando…</div>
    <div class="progress-row" id="progressRow">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     CONFIG — editar aquí para reutilizar el widget en otro ciclo
     ============================================================ */
  var CYCLE_START_YEAR = 2026;
  var CYCLE_START_MONTH = 8;   // 1-12 (agosto = 8)
  var CYCLE_START_DAY = 24;
  var TOTAL_WEEKS = 16;
  var CYCLE_LABEL = "2026-2";
  /* ============================================================ */

  var MONTHS_ES = [
    "enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
  ];

  // Constructor local explícito (NO usar strings ISO: se interpretan como UTC
  // y pueden desfasar la fecha un día según el huso horario del usuario).
  var CYCLE_START = new Date(CYCLE_START_YEAR, CYCLE_START_MONTH - 1, CYCLE_START_DAY);
  CYCLE_START.setHours(0, 0, 0, 0);

  var DAY_MS = 24 * 60 * 60 * 1000;

  var els = {
    cycleLabel: document.getElementById("cycleLabel"),
    weekNumber: document.getElementById("weekNumber"),
    dateRange: document.getElementById("dateRange"),
    progressRow: document.getElementById("progressRow"),
    progressFill: document.getElementById("progressFill"),
    progressPct: document.getElementById("progressPct")
  };

  els.cycleLabel.textContent = "CICLO " + CYCLE_LABEL;

  function normalize(d) {
    var nd = new Date(d);
    nd.setHours(0, 0, 0, 0);
    return nd;
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / DAY_MS);
  }

  function addDays(d, n) {
    var nd = new Date(d);
    nd.setDate(nd.getDate() + n);
    return nd;
  }

  function formatRange(start, end) {
    var sameMonth = start.getMonth() === end.getMonth();
    if (sameMonth) {
      return start.getDate() + " — " + end.getDate() + " " + MONTHS_ES[end.getMonth()];
    }
    return start.getDate() + " " + MONTHS_ES[start.getMonth()] +
      " — " + end.getDate() + " " + MONTHS_ES[end.getMonth()];
  }

  function computeState() {
    var today = normalize(new Date());
    var diffDays = daysBetween(CYCLE_START, today);

    if (diffDays < 0) {
      return { status: "not-started" };
    }

    var weekIndex = Math.floor(diffDays / 7) + 1;

    if (weekIndex > TOTAL_WEEKS) {
      return { status: "finished" };
    }

    var weekStart = addDays(CYCLE_START, (weekIndex - 1) * 7);
    var weekEnd = addDays(weekStart, 6);
    var pct = Math.round((weekIndex / TOTAL_WEEKS) * 100);

    return {
      status: "active",
      weekIndex: weekIndex,
      weekStart: weekStart,
      weekEnd: weekEnd,
      pct: pct
    };
  }

  var lastKey = null;

  function paint(state) {
    if (state.status === "not-started") {
      els.weekNumber.textContent = "Próximamente";
      els.weekNumber.classList.add("state-message");
      els.dateRange.textContent = "El ciclo aún no ha comenzado";
      els.progressFill.style.width = "0%";
      els.progressPct.textContent = "0%";
      return;
    }

    if (state.status === "finished") {
      els.weekNumber.textContent = "Ciclo finalizado";
      els.weekNumber.classList.add("state-message");
      els.dateRange.textContent = "El ciclo ya terminó";
      els.progressFill.style.width = "100%";
      els.progressPct.textContent = "100%";
      return;
    }

    els.weekNumber.classList.remove("state-message");
    els.weekNumber.textContent = "SEMANA " + state.weekIndex;
    els.dateRange.textContent = formatRange(state.weekStart, state.weekEnd);
    els.progressFill.style.width = state.pct + "%";
    els.progressPct.textContent = state.pct + "%";
  }

  function render() {
    var state = computeState();
    var key = state.status + ":" + (state.weekIndex || "");
    lastKey = key;
    paint(state);
    scheduleNextTransition();
  }

  function maybeRender() {
    var state = computeState();
    var key = state.status + ":" + (state.weekIndex || "");
    if (key !== lastKey) {
      lastKey = key;
      paint(state);
      scheduleNextTransition();
    }
  }

  // Próximo lunes 00:00 estrictamente posterior a "now"
  function nextMondayMidnight(now) {
    var d = normalize(now);
    var day = d.getDay(); // domingo=0 ... lunes=1 ... sábado=6
    var diff = (1 - day + 7) % 7;
    if (diff === 0) diff = 7; // si hoy es lunes, el próximo corte es en 7 días
    return addDays(d, diff);
  }

  var pendingTimeout = null;

  function scheduleNextTransition() {
    if (pendingTimeout) {
      clearTimeout(pendingTimeout);
      pendingTimeout = null;
    }
    var now = new Date();
    var target = nextMondayMidnight(now);
    var ms = target.getTime() - now.getTime() + 1000; // +1s de margen
    // setTimeout tiene un límite práctico (~24.8 días); nunca lo superamos
    // aquí porque el máximo posible es 7 días, pero se acota por seguridad.
    if (ms > 2147000000) ms = 2147000000;
    pendingTimeout = setTimeout(render, ms);
  }

  // Respaldo: revalida cada 60s y al volver a la pestaña, por si el
  // dispositivo estuvo en reposo/suspendido y el setTimeout no se disparó.
  setInterval(maybeRender, 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) maybeRender();
  });
  window.addEventListener("focus", maybeRender);

  render();
})();
</script>

</body>
</html>
